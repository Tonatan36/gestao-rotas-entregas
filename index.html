<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão de Rotas de Entrega</title>
  <link rel="stylesheet" href="style.css">
  <!-- Supabase Client UMD -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- ================= TELA DE LOGIN ================= -->
  <div id="authContainer" class="auth-container">
    <div class="auth-box">
      <h2>🔑 Acesso ao Sistema</h2>
      <p>Digite seu nome e senha para acessar as rotas.</p>
      <form id="formLogin">
        <div class="grupo-formulario">
          <label for="loginNome">Nome de Usuário</label>
          <input type="text" id="loginNome" required placeholder="Ex: ewerton">
        </div>
        <div class="grupo-formulario">
          <label for="loginSenha">Senha</label>
          <input type="password" id="loginSenha" required placeholder="Sua senha">
        </div>
        <div id="msgErroLogin" class="mensagem-erro" style="display: none;"></div>
        <button type="submit" class="botao-principal">Entrar</button>
      </form>
    </div>
  </div>

  <!-- ================= APLICAÇÃO PRINCIPAL ================= -->
  <div id="appContainer" class="app-container" style="display: none;">
    <header class="cabecalho-app">
      <div class="topo-acoes">
        <div>
          <h1 id="tituloRota">Rota do dia</h1>
          <p id="dataHoje" class="data-hoje">-</p>
        </div>
        <button type="button" id="botaoSair" class="botao-pequeno">Sair</button>
      </div>
      
      <!-- Estatísticas / Indicadores -->
      <div class="estatisticas-painel">
        <div class="card-estatistica">
          <span id="totalEntregas" class="numero-estatistica">0</span>
          <span class="rotulo-estatistica">Total</span>
        </div>
        <div class="card-estatistica">
          <span id="totalPendentes" class="numero-estatistica">0</span>
          <span class="rotulo-estatistica">Pendentes</span>
        </div>
        <div class="card-estatistica">
          <span id="totalConcluidas" class="numero-estatistica">0</span>
          <span class="rotulo-estatistica">Concluídas</span>
        </div>
      </div>
    </header>

    <main class="conteudo-principal">
      <!-- Seção de Cadastro / Edição -->
      <section class="secao-formulario">
        <h2>Nova / Editar Entrega</h2>
        <form id="formEntrega">
          <input type="hidden" id="entregaId">
          
          <div class="grid-formulario">
            <div class="grupo-formulario">
              <label for="cliente">Cliente / Empresa *</label>
              <input type="text" id="cliente" required placeholder="Nome do cliente">
            </div>
            <div class="grupo-formulario">
              <label for="telefone">Telefone / WhatsApp</label>
              <input type="text" id="telefone" placeholder="(83) 90000-0000">
            </div>
            <div class="grupo-formulario">
              <label for="rua">Rua / Logradouro *</label>
              <input type="text" id="rua" required placeholder="Ex: Av. Epitácio Pessoa">
            </div>
            <div class="grupo-formulario">
              <label for="numero">Número *</label>
              <input type="text" id="numero" required placeholder="Ex: 1000 ou S/N">
            </div>
            <div class="grupo-formulario">
              <label for="bairro">Bairro *</label>
              <input type="text" id="bairro" required placeholder="Ex: Bancários">
            </div>
            <div class="grupo-formulario">
              <label for="cidadeUf">Cidade / UF *</label>
              <input type="text" id="cidadeUf" value="João Pessoa - PB" required>
            </div>
          </div>

          <div class="grupo-formulario">
            <label for="observacao">Observações (Ponto de referência, portão, etc.)</label>
            <textarea id="observacao" rows="2" placeholder="Ex: Deixar na portaria"></textarea>
          </div>

          <div class="botoes-form">
            <button type="submit" id="botaoSalvar" class="botao-principal">Adicionar à rota</button>
            <button type="button" id="botaoCancelar" class="botao-secundario escondido">Cancelar</button>
          </div>
        </form>
      </section>

      <!-- Ferramentas e Seletor de Data -->
      <section class="secao-ferramentas">
        <div class="grupo-formulario data-seletor">
          <label for="dataSelecionada">Data da Rota:</label>
          <input type="date" id="dataSelecionada">
          <button type="button" id="botaoHoje" class="botao-pequeno">Hoje</button>
        </div>
        <p id="avisoDataCadastro" class="aviso-data">Novas entregas serão registradas na data selecionada.</p>

        <!-- Barra de Ações Avançadas (CSV, GPS, WhatsApp, Agrupar, Histórico) -->
        <div class="acoes-extras">
          <label for="inputCsv" class="botao-pequeno botao-arquivo">📂 Importar CSV</label>
          <input type="file" id="inputCsv" accept=".csv" style="display: none;">

          <button type="button" id="botaoOtimizar" class="botao-pequeno">📍 Otimizar GPS</button>
          <button type="button" id="botaoWhatsapp" class="botao-pequeno">💬 Partilhar WhatsApp</button>
          
          <!-- Novos botões integrados -->
          <button type="button" id="botaoAgruparBairro" class="botao-pequeno">📦 Agrupar por Bairro</button>
          <button type="button" id="botaoSalvarHistorico" class="botao-pequeno">💾 Salvar Histórico</button>
        </div>
      </section>

      <!-- Lista de Entregas Pendentes -->
      <section class="secao-lista">
        <h2>Entregas Pendentes</h2>
        <div id="listaPendentes" class="lista-cards">
          <!-- Os cards das entregas entram aqui via JavaScript -->
        </div>
      </section>

      <!-- Lista de Entregas Concluídas -->
      <section class="secao-lista">
        <h2>Concluídas (<span id="contadorConcluidas">0</span>)</h2>
        <div id="listaConcluidas" class="lista-cards concluidas">
          <!-- As entregas concluídas entram aqui via JavaScript -->
        </div>
      </section>
    </main>
  </div>

  <!-- Contêiner de Notificações (Toasts) -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- Script Principal -->
  <script src="script.js"></script>
</body>
</html>
